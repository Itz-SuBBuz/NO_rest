<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Detection System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            transition: all 0.3s ease;
        }

        .status-indicator.alert {
            background: #ef4444;
            box-shadow: 0 0 20px #ef4444;
            animation: pulse 0.5s ease-in-out infinite;
        }

        .status-indicator.warning {
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        #status {
            font-size: 16px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        #status.alert {
            color: #ef4444;
        }

        #status.normal {
            color: #4ade80;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        #stopBtn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        #stopBtn:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .video-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }

        #videoFeed {
            display: none;
        }

        #canvasOutput {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .metric {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #earValue {
            color: #667eea;
        }

        #blinkCount {
            color: #4ade80;
        }

        #drowsinessScore {
            color: #fbbf24;
        }

        #alertMessage {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #alertMessage.alert {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            animation: alertPulse 0.5s ease-in-out infinite;
        }

        #alertMessage.normal {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        @keyframes alertPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Sleep Detection System</h1>
            <p>AI-powered drowsiness monitoring for safer driving</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="status">System Ready</span>
        </div>

        <div class="controls">
            <button id="startBtn">▶ Start Detection</button>
            <button id="stopBtn" disabled>◼ Stop</button>
        </div>

        <div class="video-container">
            <video id="videoFeed" autoplay playsinline></video>
            <canvas id="canvasOutput"></canvas>
        </div>

        <div class="metrics">
            <div class="metric">
                <div class="metric-label">Eye Aspect Ratio</div>
                <div class="metric-value" id="earValue">--</div>
            </div>
            <div class="metric">
                <div class="metric-label">Blink Count</div>
                <div class="metric-value" id="blinkCount">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Drowsiness</div>
                <div class="metric-value" id="drowsinessScore">0%</div>
            </div>
        </div>

        <div id="alertMessage" class="normal">bkl is alert and focused</div>
    </div>


    <!-- Audio alert - MUST be before script -->
    <audio id="alertSound" preload="auto" loop>
        <source src="sound.mp3" type="audio/mpeg">
    </audio>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="advanced_script.js"></script>
</body>

</html>
